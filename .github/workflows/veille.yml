name: Veille CGP (Notion → portail)

on:
  schedule:
    # Toutes les 3 h à :47 (UTC). Décalé du :17 de update.yml pour ne jamais pousser en même temps.
    # Délai maximum entre l'écriture dans Notion et la mise en ligne : 3 h.
    - cron: '47 */3 * * *'
  workflow_dispatch: {}     # « Run workflow » dans l'onglet Actions pour publier tout de suite

permissions:
  contents: write

concurrency:
  group: maj-quotidienne
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        run: pip install --quiet cryptography

      - name: Reconstruction de veille.js depuis Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
          PORTAL_PW: ${{ secrets.PORTAL_PW }}
        run: python veille_notion.py

      - name: Commit et publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille.js
          git diff --cached --quiet && echo "Aucun changement" || {
            git commit -m "Veille CGP : mise à jour depuis Notion"
            git pull --rebase
            git push
          }
