name: Mise à jour complète (mensuelle)

on:
  schedule:
    # Le 1er du mois à 00:17 UTC = 02h17 Paris en été, 01h17 en hiver (les crons GitHub ne connaissent pas
    # l'heure locale). Relit TOUT l'historique des ateliers, réunions, formations et événements depuis l'origine.
    - cron: '17 0 1 * *'
  workflow_dispatch: {}     # à lancer à la main pour la première récupération complète

permissions:
  contents: write

concurrency:
  group: maj-quotidienne    # jamais en même temps que la mise à jour rapide
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        run: pip install --quiet requests cryptography

      - name: Régénération complète des données
        id: maj
        env:
          PORTAL_PW: ${{ secrets.PORTAL_PW }}
          API_BASE: ${{ secrets.API_BASE }}
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
          LIGNEE: ${{ secrets.LIGNEE }}
          LIGNEE_FILLEULS_DE: ${{ secrets.LIGNEE_FILLEULS_DE }}
          KAIROS_TOKEN: ${{ secrets.KAIROS_TOKEN }}
        run: python update.py --complet

      - name: Journal — échec avant le script
        # update.py écrit lui-même sa ligne de journal (début, puis succès ou échec).
        # Ce filet ne sert qu'aux pannes en amont : checkout, installation de Python, dépendances.
        if: failure() && steps.maj.outcome != 'failure'
        env:
          KAIROS_TOKEN: ${{ secrets.KAIROS_TOKEN }}
        run: |
          curl -sS -X POST "https://xslusoecharxelwmbyal.supabase.co/functions/v1/journal" \
            -H "x-kairos-token: $KAIROS_TOKEN" -H "Content-Type: application/json" \
            -d '{"action":"fin","tache":"update_complet","statut":"echec","source":"github","execution":"${{ github.run_id }}","erreur":"Le job a échoué avant le lancement du script (préparation du runner)."}' \
            || true

      - name: Commit et publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html meta.js sw.js
          git rm -q --cached --ignore-unmatch donnees.js
          git diff --cached --quiet && echo "Aucun changement" || {
            git commit -m "Mise à jour complète des données"
            git push
          }
