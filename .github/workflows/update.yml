name: Mise à jour rapide (4 fois par jour)

on:
  schedule:
    # 4 passages par jour, heures UTC (Paris = UTC+2 en été, +1 en hiver) : minuit, 6h, midi, 18h Paris en été
    # (23h, 5h, 11h, 17h en hiver). Minute non ronde pour limiter les retards GitHub (les crons à l'heure pile
    # sont les plus chargés). Le script est idempotent : un passage sans changement ne publie rien.
    - cron: '17 22 * * *'   # 00h17 Paris (été)
    - cron: '17 4 * * *'    # 06h17
    - cron: '17 10 * * *'   # 12h17
    - cron: '17 16 * * *'   # 18h17
  workflow_dispatch: {}     # permet aussi de lancer à la main depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: maj-quotidienne
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        run: pip install --quiet requests cryptography

      - name: Régénération des données
        env:
          PORTAL_PW: ${{ secrets.PORTAL_PW }}
          API_BASE: ${{ secrets.API_BASE }}
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
          LIGNEE: ${{ secrets.LIGNEE }}
          LIGNEE_FILLEULS_DE: ${{ secrets.LIGNEE_FILLEULS_DE }}
          KAIROS_TOKEN: ${{ secrets.KAIROS_TOKEN }}
        run: python update.py

      - name: Commit et publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html meta.js
          git rm -q --cached --ignore-unmatch donnees.js
          git diff --cached --quiet && echo "Aucun changement" || {
            git commit -m "Mise à jour quotidienne des données"
            git push
          }
