name: Mise à jour quotidienne

on:
  schedule:
    # Heures UTC, minute non ronde pour limiter les retards de GitHub (les crons à l'heure pile
    # sont les plus chargés). Le script est idempotent : un 2e passage sans changement ne publie rien.
    - cron: '17 22 * * *'   # 00h17 Paris en été (23h17 en hiver) : passage principal
    - cron: '17 4 * * *'    # 06h17 Paris en été (05h17 en hiver) : filet de sécurité si le 1er est sauté
  workflow_dispatch: {}     # permet aussi de lancer à la main depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: maj-quotidienne
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        run: pip install --quiet requests cryptography

      - name: Régénération des données
        env:
          PORTAL_PW: ${{ secrets.PORTAL_PW }}
          API_BASE: ${{ secrets.API_BASE }}
          LIGNEE: ${{ secrets.LIGNEE }}
          LIGNEE_FILLEULS_DE: ${{ secrets.LIGNEE_FILLEULS_DE }}
        run: python update.py

      - name: Commit et publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Aucun changement" || {
            git commit -m "Mise à jour quotidienne des données"
            git push
          }
